apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf.template: |
    port 6379
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    cluster-announce-ip ${POD_NAME}.redis.redis.svc.cluster.local
    cluster-announce-port 6379
    cluster-announce-bus-port 16379
