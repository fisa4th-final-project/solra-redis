apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  replicas: 6
  serviceName: redis
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.8
          ports:
            - containerPort: 6379
            - containerPort: 16379
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-generated
              mountPath: /data/config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - |
              envsubst < /etc/redis/redis.conf.template > /data/config/redis.conf && \
              redis-server /data/config/redis.conf
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-generated
          emptyDir: {}
